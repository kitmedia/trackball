version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15
    container_name: trackball-postgres
    environment:
      POSTGRES_DB: trackball_dev
      POSTGRES_USER: trackball_dev
      POSTGRES_PASSWORD: dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./tools/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - trackball-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trackball_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7.2
    container_name: trackball-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./tools/docker/redis/redis.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf
    networks:
      - trackball-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Backend
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: trackball-api
    ports:
      - "3333:3333"
    environment:
      - DATABASE_URL=postgresql://trackball_dev:dev_password@postgres:5432/trackball_dev
      - REDIS_URL=redis://redis:6379/0
      - DEBUG=true
      - ENVIRONMENT=development
    volumes:
      - ./apps/api:/app
      - api_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - trackball-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3333/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # React Frontend (development)
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: trackball-web
    ports:
      - "4200:4200"
    environment:
      - NODE_ENV=development
      - VITE_API_BASE_URL=http://localhost:3333
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
    depends_on:
      - api
    networks:
      - trackball-network
    restart: unless-stopped

  # Nginx Reverse Proxy (optional for production-like setup)
  nginx:
    image: nginx:alpine
    container_name: trackball-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./tools/docker/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./tools/docker/nginx/ssl:/etc/nginx/ssl
    depends_on:
      - web
      - api
    networks:
      - trackball-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  api_logs:
    driver: local
  web_node_modules:
    driver: local

networks:
  trackball-network:
    driver: bridge